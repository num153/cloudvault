events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tối ưu kích thước upload file lớn
    client_max_body_size 1024M;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream services
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    upstream minio_s3_upstream {
        server minio:9000;
    }

    upstream minio_console_upstream {
        server minio:9001;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend web client
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend REST API
        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger Docs direct proxy
        location /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MinIO S3 API
        location /s3/ {
            proxy_pass http://minio_s3_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }
        
        # Định tuyến MinIO S3 Presigned URL theo tên bucket (Phương án A)
        location /cloudvault-data/ {
            proxy_pass http://minio_s3_upstream;  # QUAN TRỌNG: KHÔNG có dấu gạch chéo cuối để giữ nguyên path
            proxy_set_header Host $http_host;      # Giữ nguyên Host và số cổng của Client
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;           # Cho phép stream thẳng file lên MinIO, không đệm vào đĩa Nginx
            client_max_body_size 1024M;            # Cho phép upload file lớn lên tới 1GB (NFR-04)
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # MinIO Admin Web Console
        location /minio/ {
            proxy_pass http://minio_console_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
